<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MucknSpark</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="v">
<div class="top">
<h1 class="title">MucknSpark</h1>
</div>
<div class="mid">
<div class="wrap">
<canvas id="c" width="1200" height="600"></canvas>
<div class="grain"></div>
<div class="vig"></div>
<div id="ov" class="ov">
<p class="big">Fallen</p>
<p class="sm">the muck claims another</p>
<p class="sc">score: <span id="fs">0</span></p>
<button id="rs" class="btn">rise again</button>
</div>
<div id="st" class="st">
<p class="stt">press any key to start</p>
</div>
</div>
</div>
<div class="bot">
<div class="hud">
<div class="hp">
<div class="hb"><div id="h" class="hf"></div></div>
<span class="hl">Flesh</span>
</div>
<div class="info">
<span id="w" class="wv">Wave 1</span>
<span id="p" class="pt">0</span>
<span class="hs-text">High Score: <span id="hs">0</span></span>
</div>
</div>
<div class="ctrl">
<span class="k">A/D</span><span class="l">Move</span>
<span class="k">J</span><span class="l">Cleave</span>
<span class="k">K</span><span class="l">Roll</span>
</div>
</div>
</div>
<script src="audio.js"></script>
<script src="logic.js"></script>
</body>
</html>
